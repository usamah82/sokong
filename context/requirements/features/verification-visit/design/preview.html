<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sokong verification visit</title>
  <style>
    :root {
      --paper: #f3f0e8;
      --sheet: #fffcf7;
      --ink: #1c1915;
      --muted: #5c564c;
      --line: #d4cec3;
      --accent: #1e3a2f;
      --accent-ink: #fffcf7;
      --error: #8c1d1d;
      --space: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.45 ui-sans-serif, system-ui, sans-serif;
    }

    .phone {
      width: 390px;
      max-width: 100%;
      margin: 0 auto;
      padding: 20px var(--space) 32px;
      background: var(--sheet);
    }

    .mark {
      margin: 0;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 4px 0 16px;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 650;
    }

    h2 {
      margin: 20px 0 8px;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 650;
    }

    h2 small {
      display: inline;
      margin-left: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    p { margin: 0 0 12px; }

    .aim, .late, .note {
      margin: 0 0 12px;
      font-size: 15px;
    }

    .late { padding: 12px; background: var(--paper); }

    label.field, .choice-set { display: block; margin: 0 0 16px; }

    fieldset {
      border: 0;
      margin: 0 0 16px;
      padding: 0;
      min-inline-size: 0;
    }

    .label, legend {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 650;
    }

    .enrolment {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .verified {
      margin: 0 0 8px;
      font-size: 15px;
    }

    input[type="text"],
    input[type="tel"],
    input[type="date"],
    input[type="datetime-local"],
    select,
    textarea {
      width: 100%;
      min-height: 44px;
      margin-top: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: inherit;
      font: inherit;
    }

    textarea { min-height: 4.8em; resize: vertical; }

    input:focus, select:focus, textarea:focus, button:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    input[aria-invalid="true"] { border-color: var(--error); }

    .error {
      margin: 8px 0 0;
      color: var(--error);
      font-size: 14px;
    }

    .choice, .check {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 0 0 10px;
    }

    .choice input, .check input { margin-top: 4px; }

    .actions { display: flex; gap: 8px; margin-top: 8px; }

    button, .person-btn, .stage {
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid var(--accent);
      border-radius: 4px;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-weight: 650;
      text-align: left;
    }

    .primary {
      flex: 1;
      background: var(--accent);
      color: var(--accent-ink);
      text-align: center;
    }

    .secondary { text-align: center; }

    button.block { display: block; width: 100%; margin: 0 0 12px; }

    .stages { list-style: none; margin: 0 0 16px; padding: 0; }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
      margin: 0 0 8px;
    }

    .stage.current { background: var(--paper); }

    .stage small {
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
    }

    .people { list-style: none; margin: 0 0 16px; padding: 0; }

    .person-btn { display: block; width: 100%; margin: 0 0 8px; }

    .person-btn.open { background: var(--paper); }

    .person {
      margin: 0 0 16px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    time { font-variant-numeric: tabular-nums; }

    .cases { list-style: none; margin: 0; padding: 0; }

    .cases a {
      display: block;
      margin: 0 0 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
    }

    .cases small { display: block; color: var(--muted); font-size: 14px; }

    .look { margin: 0 0 16px; padding-top: 8px; border-top: 1px solid var(--line); }

    .worker { margin: 0; font-weight: 650; }
  </style>
</head>
<body>
  <main class="phone" id="app"></main>
  <script>
    const stages = [
      ["who", "Who is here"],
      ["formation", "How the family formed"],
      ["day", "A day in their life"],
      ["together", "How they are together"],
      ["house", "The house and the meals"],
      ["needs", "What they need"]
    ];

    const params = new URLSearchParams(location.search);
    const name = params.get("screen") || "set-visit";

    const saved = {
      who: false,
      formation: true,
      day: true,
      together: false,
      house: false,
      needs: true
    };

    function field(label, value, extra) {
      const invalid = extra && extra.invalid ? ' aria-invalid="true"' : "";
      const type = extra && extra.type ? extra.type : "text";
      const error = extra && extra.error ? `<p class="error">${extra.error}</p>` : "";
      const prior = extra && extra.enrolment ? `<p class="enrolment">Enrolment ${extra.enrolment}</p>` : "";
      const verified = extra && extra.verified ? `<p class="verified">${extra.verified}</p>` : "";
      return `<label class="field"><span class="label">${label}</span>${prior}${verified}<input type="${type}" value="${value || ""}"${invalid}>${error}</label>`;
    }

    function area(label, value) {
      return `<label class="field"><span class="label">${label}</span><textarea rows="3">${value || ""}</textarea></label>`;
    }

    function yesNo(label, answer, enrolment) {
      const prior = enrolment ? `<p class="enrolment">Enrolment ${enrolment}</p>` : "";
      return `<fieldset class="choice-set"><legend>${label}</legend>${prior}
        <label class="choice"><input type="radio" name="${label}" ${answer === "yes" ? "checked" : ""}> Yes</label>
        <label class="choice"><input type="radio" name="${label}" ${answer === "no" ? "checked" : ""}> No</label>
      </fieldset>`;
    }

    function choice(label, options, selected) {
      const items = options.map((opt) => `<label class="choice"><input type="radio" name="${label}" ${opt === selected ? "checked" : ""}> ${opt}</label>`).join("");
      return `<fieldset class="choice-set"><legend>${label}</legend>${items}</fieldset>`;
    }

    function check(label, on) {
      return `<label class="check"><input type="checkbox" ${on ? "checked" : ""}> ${label}</label>`;
    }

    function anything(value) {
      return area("Anything else they said", value);
    }

    function documents() {
      return `<fieldset class="choice-set"><legend>Documents</legend>
        <label class="field"><span class="label">Document</span>
          <select><option>National ID</option><option>Social security number</option><option>Passport</option><option>Birth certificate</option><option>Other</option></select>
        </label>
        ${field("Number", "900101-14-5567")}
        <button class="secondary block" type="button">Remove</button>
        <button class="secondary block" type="button">Add a document</button>
      </fieldset>`;
    }

    function stageList(current, done) {
      const items = stages.map(([id, label]) => {
        const state = current && id === current ? "Current" : "";
        const kept = done || saved[id] ? "Saved" : "Not saved";
        const text = [state, kept].filter(Boolean).join(" · ");
        return `<li><button type="button" class="stage${id === current ? " current" : ""}">${label}<small>${text}</small></button></li>`;
      }).join("");
      return `<h2>Verification Interview</h2><ol class="stages">${items}</ol>`;
    }

    function assignedWorkers() {
      return `<fieldset class="choice-set"><legend>Assigned workers</legend>
        ${field("Name", "Aman")}
        <button class="secondary block" type="button">Add a worker</button>
      </fieldset>`;
    }

    function visitHeader(mode) {
      const late = mode === "late";
      const time = late ? "25 November 2026 at 09:00" : "24 November 2026 at 09:00";
      const iso = late ? "2026-11-25T01:00:00Z" : "2026-11-24T01:00:00Z";
      return `
        <h2>Pre-visit</h2>
        <p class="aim">Aim for a visit within a week of the enrolment.</p>
        ${late ? '<p class="late">This visit is later than a week after the enrolment.</p>' : ""}
        <label class="field"><span class="label">Visit time</span>
          <time datetime="${iso}">${time}</time>
        </label>
        ${check("Bringing a basket", true)}
        ${assignedWorkers()}
        <button class="primary block" type="button">Change visit</button>`;
    }

    function caseTop() {
      return `<p class="mark">Sokong</p><h1>Block 4</h1>`;
    }

    function nav(which) {
      const back = which === "first" ? "" : `<button class="secondary" type="button">Back</button>`;
      const next = which === "last" ? "" : `<button class="primary" type="button">Next</button>`;
      return `<div class="actions">${back}${next}</div>`;
    }

    function people(mode, added) {
      const absent = mode === "absent";
      const phone = mode === "error"
        ? field("Phone", "Mary at the shop", { invalid: true, type: "tel", error: "Enter a phone number, for example +60 12-345 6789.", enrolment: "+60 12-345 6789" })
        : field("Phone", absent ? "" : "+60 12-345 6789", absent ? { type: "tel" } : { type: "tel", enrolment: "+60 12-345 6789" });
      const name = absent ? "Rahman" : "Aminah";
      const relationship = absent
        ? choice("Relationship", ["Spouse", "Child", "Parent", "Other"], "Spouse")
        : `<p><span class="label">Relationship</span> Head</p>`;
      const identity = choice("Identity", ["Verified", "Not verified", "No papers"], absent ? "No papers" : "Not verified");
      const away = absent ? `
        ${check("Absent", true)}
        ${field("Since when", "2025-11-01")}
        ${area("Why", "He left for work in another town.")}` : check("Absent", false);
      return `
        <p>The children are the people recorded here.</p>
        <ul class="people">
          <li><button class="person-btn${absent ? "" : " open"}" type="button">Aminah</button></li>
          <li><button class="person-btn" type="button">Sarah</button></li>
          ${absent ? `<li><button class="person-btn open" type="button">Rahman</button></li>` : ""}
          ${added ? `<li><button class="person-btn" type="button">Farid</button><button class="secondary block" type="button">Remove</button></li>` : ""}
        </ul>
        <div class="person">
          ${field("Full name", name, absent ? {} : { enrolment: "Aminah" })}
          ${field("Birth date", absent ? "1990-06-12" : "1992-04-03")}
          <label class="field"><span class="label">Gender</span>${absent ? "" : `<p class="enrolment">Enrolment Female</p>`}
            <select><option${absent ? " selected" : ""}>Male</option><option${absent ? "" : " selected"}>Female</option><option>Unspecified</option></select>
          </label>
          ${phone}
          ${relationship}
          ${field("From where?", absent ? "The next state" : "This district")}
          ${identity}
          ${documents()}
          ${away}
        </div>
        <button class="secondary block" type="button">Add a person</button>
        ${yesNo("Does anyone else stay who is not in that list?", "yes")}
        ${area("Who, and why?", "A cousin sleeps here a few nights a month when he is between jobs.")}
        ${yesNo("Do you have to take care of elderly parents?", "yes")}
        ${area("Who, and what do you do for them?", "Aminah's mother lives nearby. Aminah cooks for her and helps her wash.")}
        ${anything("")}
        ${nav("first")}`;
    }

    const bodies = {
      "set-visit": () => `
        ${caseTop()}
        <h2>Pre-visit</h2>
        <p class="aim">Aim for a visit within a week of the enrolment.</p>
        <p>Set the visit before recording it.</p>
        <label class="field"><span class="label">Visit time</span><input type="text"></label>
        ${check("Bringing a basket", false)}
        <fieldset class="choice-set"><legend>Assigned workers</legend>
          ${field("Name", "Aman")}
          <button class="secondary block" type="button">Add a worker</button>
        </fieldset>
        <button class="primary block" type="button">Set visit</button>`,

      "visit-invalid": () => `
        ${caseTop()}
        <h2>Pre-visit</h2>
        <p class="aim">Aim for a visit within a week of the enrolment.</p>
        <p>Set the visit before recording it.</p>
        <label class="field"><span class="label">Visit time</span><input type="text" value="Tuesday" aria-invalid="true"><p class="error">Visit time is invalid</p></label>
        ${check("Bringing a basket", false)}
        <fieldset class="choice-set"><legend>Assigned workers</legend>
          ${field("Name", "Aman")}
          <button class="secondary block" type="button">Add a worker</button>
        </fieldset>
        <button class="primary block" type="button">Set visit</button>`,

      "visit-late": () => `
        ${caseTop()}
        ${visitHeader("late")}
        ${stageList("who")}
        <h2>Who is here</h2>
        ${people("head", false)}`,

      "who-is-here": () => `
        ${caseTop()}
        ${visitHeader("week")}
        ${stageList("who")}
        <h2>Who is here</h2>
        ${people("head", true)}`,

      "who-absent": () => `
        ${caseTop()}
        ${visitHeader("week")}
        ${stageList("who")}
        <h2>Who is here</h2>
        ${people("absent", false)}`,

      "who-error": () => `
        ${caseTop()}
        ${visitHeader("week")}
        ${stageList("who")}
        <h2>Who is here</h2>
        ${people("error", false)}`,

      formation: () => `
        ${caseTop()}
        ${visitHeader("week")}
        ${stageList("formation")}
        <h2>How the family formed</h2>
        ${field("When did this family start?", "2008")}
        ${area("How did it start?", "Aminah and Rahman married after meeting at the market.")}
        ${anything("")}
        ${nav()}`,

      "daily-life": () => `
        ${caseTop()}
        ${visitHeader("week")}
        ${stageList("day")}
        <h2>A day in their life</h2>
        <ul class="people">
          <li><button class="person-btn open" type="button">Aminah</button></li>
          <li><button class="person-btn" type="button">Sarah</button></li>
        </ul>
        ${yesNo("Are you working?", "yes", "Yes")}
        ${yesNo("Are you in school?", "no", "No")}
        ${field("What job?", "Food stall", { enrolment: "Food stall" })}
        ${field("Ringgit per month", "800", { enrolment: "800" })}
        ${area("Any previous jobs?", "She packed goods at a shop before the stall.")}
        ${area("If you wish for a new job or income, what would that be?", "A stall with a roof, closer to the flat.")}
        ${area("Any skills to highlight?", "She cooks for a crowd and keeps the day's takings.")}
        ${anything("")}
        ${nav()}`,

      "daily-school": () => `
        ${caseTop()}
        ${visitHeader("week")}
        ${stageList("day")}
        <h2>A day in their life</h2>
        <ul class="people">
          <li><button class="person-btn" type="button">Aminah</button></li>
          <li><button class="person-btn open" type="button">Sarah</button></li>
        </ul>
        ${yesNo("Are you working?", "no", "No")}
        ${yesNo("Are you in school?", "yes", "Yes")}
        ${area("How is school going?", "She stopped going when the stall got busy.")}
        ${field("Where is school?", "The school at the end of the lane")}
        ${area("How do you get there?", "She walks. The bus fare is the hard part.")}
        ${area("Any skills to highlight?", "She keeps the stall's list of what sold.")}
        ${anything("")}
        ${nav()}`,

      dynamics: () => `
        ${caseTop()}
        ${visitHeader("week")}
        ${stageList("together")}
        <h2>How they are together</h2>
        <p>Write what the family said.</p>
        ${area("What does a hard week look like here?", "The nights at the stall are long, and the rent notice comes before the money does.")}
        ${area("When someone here needs help, who steps in?", "Aminah cooks, sells, and gets Sarah to the stall. Rahman is away.")}
        ${area("How are the children at home?", "Sarah works because the stall needs her. She is not in trouble at home.")}
        ${anything("")}
        ${nav()}`,

      house: () => `
        ${caseTop()}
        ${visitHeader("week")}
        ${stageList("house")}
        <h2>The house and the meals</h2>
        ${choice("This place", ["Own", "Rent", "Staying with someone", "Temporary"], "Rent")}
        ${field("Rent per month", "500")}
        ${yesNo("Are you behind on payments?", "yes")}
        ${yesNo("Does it have water?", "yes")}
        ${yesNo("Does it have electricity?", "yes")}
        ${field("How many rooms do people sleep in?", "1")}
        ${yesNo("Is this place safe?", "no")}
        ${area("What feels unsafe?", "The lane floods when the rain is heavy.")}
        ${choice("How many meals a day?", ["3 a day", "2 a day", "1 a day", "Not every day"], "2 a day")}
        ${area("Basket", "A week's food and some cash")}
        ${anything("")}
        ${nav()}`,

      needs: () => `
        ${caseTop()}
        ${visitHeader("week")}
        ${stageList("needs")}
        <h2>What they need</h2>
        <p class="enrolment">Enrolment Food</p>
        <p class="enrolment">Enrolment School supplies</p>
        ${area("What do you need most?", "Help with the rent, and a way for Sarah to return to school.")}
        <label class="choice"><input type="radio" name="consent"> The family consents</label>
        <label class="choice"><input type="radio" name="consent" checked> The family does not consent</label>
        ${anything("")}
        ${nav("last")}`,

      boxes: () => `
        ${caseTop()}
        ${visitHeader("week")}
        ${stageList(null)}
        <h2>Post-visit <small>Not saved</small></h2>
        <p class="label">Initial assessment</p>
        <p>This is your judgment from the visit.</p>
        ${check("Good family unit", false)}
        <p>Integrity, action, and selflessness, for the family as a whole.</p>
        ${area("Gap", "The father is away, and Sarah is out of school to keep the stall going.")}
        ${check("Basic necessities", false)}
        ${area("Gap", "Rent is behind. They do not eat three meals a day.")}
        <button class="primary block" type="button">Mark qualified</button>
        <button class="secondary block" type="button">Mark disqualified</button>`,

      "boxes-gap": () => `
        ${caseTop()}
        ${visitHeader("week")}
        ${stageList(null)}
        <h2>Post-visit <small>Not saved</small></h2>
        <p class="label">Initial assessment</p>
        <p>This is your judgment from the visit.</p>
        ${check("Good family unit", false)}
        <p>Integrity, action, and selflessness, for the family as a whole.</p>
        <label class="field"><span class="label">Gap</span><textarea rows="3" aria-invalid="true"></textarea><p class="error">Gap is required</p></label>
        ${check("Basic necessities", true)}
        ${area("Gap", "")}
        <p class="error">The family has not consented</p>
        <button class="primary block" type="button">Mark qualified</button>
        <button class="secondary block" type="button">Mark disqualified</button>`,

      "boxes-incomplete": () => `
        ${caseTop()}
        ${visitHeader("week")}
        ${stageList(null)}
        <h2>Post-visit <small>Saved</small></h2>
        <p class="label">Initial assessment</p>
        <p>This is your judgment from the visit.</p>
        ${check("Good family unit", true)}
        <p>Integrity, action, and selflessness, for the family as a whole.</p>
        ${area("Gap", "")}
        ${check("Basic necessities", true)}
        ${area("Gap", "")}
        <p class="error">The visit record is incomplete</p>
        <button class="primary block" type="button">Mark qualified</button>
        <button class="secondary block" type="button">Mark disqualified</button>`,

      marked: () => `
        ${caseTop()}
        <p>This family is qualified.</p>
        <h2>Pre-visit</h2>
        <p class="aim">Aim for a visit within a week of the enrolment.</p>
        <p><span class="label">Visit time</span> <time datetime="2026-11-24T01:00:00Z">24 November 2026 at 09:00</time></p>
        <p><span class="label">Bringing a basket</span> Yes</p>
        <p><span class="label">Assigned workers</span> Aman</p>
        ${stageList("who", true)}
        <h2>Who is here</h2>
        <p>The children are the people recorded here.</p>
        <div class="person">
          <p><span class="label">Full name</span> Aminah</p>
          <p class="enrolment">Enrolment Aminah</p>
          <p><span class="label">Birth date</span> 1992-04-03</p>
          <p><span class="label">Gender</span> Female</p>
          <p class="enrolment">Enrolment Female</p>
          <p><span class="label">Phone</span> +60 12-345 6789</p>
          <p class="enrolment">Enrolment +60 12-345 6789</p>
          <p><span class="label">Relationship</span> Head</p>
          <p><span class="label">From where?</span> This district</p>
          <p><span class="label">Identity</span> Not verified</p>
          <p><span class="label">Document</span> National ID</p>
          <p><span class="label">Number</span> 900101-14-5567</p>
        </div>
        <p><span class="label">Anything else they said</span></p>`,

      "marked-disqualified": () => `
        ${caseTop()}
        <p>This family is disqualified.</p>
        <h2>Pre-visit</h2>
        <p class="aim">Aim for a visit within a week of the enrolment.</p>
        <p><span class="label">Visit time</span> <time datetime="2026-11-24T01:00:00Z">24 November 2026 at 09:00</time></p>
        <p><span class="label">Bringing a basket</span> Yes</p>
        <p><span class="label">Assigned workers</span> Aman</p>
        ${stageList("needs", true)}
        <h2>What they need</h2>
        <p><span class="label">What do you need most?</span> Help with the rent.</p>
        <p>The family does not consent</p>`,

      "progress-quiet": () => `
        <p class="mark">Sokong</p>
        <h1>This case is in. No one has looked. No visit is set.</h1>
        <button class="secondary" type="button" id="sign-out">Sign out</button>`,

      "progress-look": () => `
        <p class="mark">Sokong</p>
        <h1>This case is in.</h1>
        <article class="look">
          <p class="worker">Aman</p>
          <time datetime="2026-11-18T02:00:00Z">18 November 2026 at 10:00</time>
          <p>Called the enroler, no answer</p>
        </article>
        <p>No visit is set.</p>
        <button class="secondary" type="button" id="sign-out">Sign out</button>`,

      "progress-visit": () => `
        <p class="mark">Sokong</p>
        <h1>This case is in.</h1>
        <p>A visit is set for <time datetime="2026-11-24T01:00:00Z">24 November 2026 at 09:00</time>.</p>
        <button class="secondary" type="button" id="sign-out">Sign out</button>`,

      "progress-qualified": () => `
        <p class="mark">Sokong</p>
        <h1>This case is in.</h1>
        <p>A visit is set for <time datetime="2026-11-24T01:00:00Z">24 November 2026 at 09:00</time>.</p>
        <p>This family is qualified.</p>
        <button class="secondary" type="button" id="sign-out">Sign out</button>`,

      cases: () => `
        <p class="mark">Sokong</p>
        <ul class="cases" id="cases">
